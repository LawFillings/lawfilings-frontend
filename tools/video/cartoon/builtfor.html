<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>LawFilings "Built for" cartoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #000; }
  #stage { background: #f3ead6; position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }
  svg { position: absolute; inset: 0; }
  #caption { position: absolute; left: 90px; right: 90px; bottom: 26px; text-align: center; color: #fff; font-size: 27px; line-height: 1.3;
    background: rgba(20, 39, 63, 0.82); border-radius: 14px; padding: 12px 22px; font-weight: 600; letter-spacing: .1px; }
  text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  .serif { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gCool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcf9f2"/><stop offset="1" stop-color="#f4ecdb"/></linearGradient>
    <linearGradient id="gWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#f6eedc"/></linearGradient>
    <linearGradient id="gSun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbef"/><stop offset="1" stop-color="#f8eed2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14273f" flood-opacity="0.22"/></filter>
  </defs>
  <g id="scenes"></g>
</svg>
<div id="caption"></div>
</div>
<script src="common.js"></script>
<script src="i18n_hi.js"></script>
<script>
const scenes = $('scenes');
function addScene(id, bg, content) { scenes.insertAdjacentHTML('beforeend', `<g id="${id}"><rect width="1280" height="720" fill="${bg}"/>${content}</g>`); }
const CAP = (id) => $(id).insertAdjacentHTML('beforeend', `<g id="${id}-cap" transform="translate(0 -218)"><polygon points="0,-18 62,0 0,20 -62,0" fill="#1d1f27"/><rect x="-28" y="4" width="56" height="22" rx="4" fill="#2b2f3a"/><line x1="54" y1="2" x2="54" y2="32" stroke="#d4a72c" stroke-width="4"/><circle cx="54" cy="36" r="5" fill="#d4a72c"/></g>`);
const floor = (c = '#ece0c2') => `<rect y="560" width="1280" height="160" fill="${c}"/>`;
const desk = (id, x, w) => `<g id="${id}"><rect x="${x}" y="480" width="${w}" height="30" rx="8" fill="#8a5a3a"/><rect x="${x + 30}" y="510" width="22" height="120" fill="#7a4d30"/><rect x="${x + w - 52}" y="510" width="22" height="120" fill="#7a4d30"/></g>`;
const padlock = (id, open) => `<g id="${id}"><rect x="-16" y="-4" width="32" height="26" rx="5" fill="#14273f"/><path d="${open ? 'M-9 -4 L-9 -16 Q-9 -28 3 -28 Q15 -28 15 -16' : 'M-9 -4 L-9 -16 Q-9 -28 0 -28 Q9 -28 9 -16 L9 -4'}" fill="none" stroke="#14273f" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="9" r="4" fill="#d4a72c"/></g>`;

// ---- S0: title + four audiences ----
addScene('S0', 'url(#gCool)', `
  ${floor()}
  <text id="eyebrow" x="640" y="92" text-anchor="middle" font-size="30" font-weight="800" fill="#a67c10" letter-spacing="6">BUILT FOR</text>
  <text id="ttl1" class="serif" x="640" y="170" text-anchor="middle" font-size="62" font-weight="700" fill="#14273f">The one who actually</text>
  <text id="ttl2" class="serif" x="640" y="242" text-anchor="middle" font-size="62" font-weight="700" fill="#14273f">files court cases</text>
  ${person('a0', { skin: '#d9a47c', hair: '#161616', coat: true, glasses: true, male: true, beard: true })}
  ${person('a1', { skin: '#c98f66', hair: '#1c140e', shirt: '#3b6ea5', male: true })}
  ${person('a2', { skin: '#e2b28d', hair: '#2a1a12', shirt: '#4b5565', longHair: true })}
  ${person('a3', { skin: '#d9a47c', hair: '#161616', shirt: '#e08a1e', male: true })}
  ${chip('p0', 'Advocates', 210, '#14273f')}${chip('p1', 'Individuals', 210, '#3b6ea5')}${chip('p2', 'Businesses', 210, '#4b5565')}${chip('p3', 'Law students', 210, '#e08a1e')}
`);
CAP('a3');

// ---- S1: advocates ----
addScene('S1', 'url(#gSun)', `
  ${floor('#efe3c4')}
  ${desk('dk1', 60, 520)}
  ${person('adv', { skin: '#d9a47c', hair: '#161616', coat: true, glasses: true, male: true, beard: true })}
  ${chip('fc0', 'District Court', 190, '#3b6ea5')}${chip('fc1', 'High Court', 170, '#7b4a9e')}${chip('fc2', 'Supreme Court', 200, '#d4a72c', '#14273f')}
  ${chip('fc3', 'Tribunal', 150, '#2f8f6b')}${chip('fc4', 'Consumer Commission', 270, '#e08a1e')}
  <g id="adoc">${paper('ad', 220, 270, '#fff', 9, '#3b6ea5')}
    <rect id="hl" x="-96" y="-20" width="0" height="20" rx="4" fill="#ffe27a" opacity=".85"/>
    <text x="0" y="-92" text-anchor="middle" font-size="15" font-weight="900" fill="#14273f">DRAFT</text></g>
  ${chip('cite', 'Order VIII Rule 1, CPC', 270, '#2f8f6b')}
  <g id="timeCard"><rect x="-140" y="-96" width="280" height="192" rx="20" fill="#fff" stroke="#14273f" stroke-width="4" filter="url(#shadow)"/>
    <text x="0" y="-64" text-anchor="middle" font-size="20" font-weight="900" fill="#14273f">Where your time goes</text>
    <text x="-120" y="-24" font-size="16" font-weight="800" fill="#5b6b82">Formatting</text><rect x="-120" y="-14" width="240" height="22" rx="11" fill="#eef3fa"/><rect id="barF" x="-120" y="-14" width="240" height="22" rx="11" fill="#d9534f"/>
    <text x="-120" y="38" font-size="16" font-weight="800" fill="#5b6b82">Judgment</text><rect x="-120" y="48" width="240" height="22" rx="11" fill="#eef3fa"/><rect id="barJ" x="-120" y="48" width="60" height="22" rx="11" fill="#2f8f6b"/></g>
`);

// ---- S2: individuals ----
addScene('S2', 'url(#gWarm)', `
  ${floor()}
  ${desk('dk2', 60, 520)}
  ${person('ind', { skin: '#c98f66', hair: '#1c140e', shirt: '#3b6ea5', male: true })}
  <g id="forms">${paper('lf0', 100, 130, '#fff', 8, '#d9534f')}${paper('lf1', 100, 130, '#fff', 8, '#e08a1e')}${paper('lf2', 100, 130, '#fff', 8, '#7b4a9e')}
    <g id="xmark"><line x1="-60" y1="-70" x2="60" y2="70" stroke="#d9534f" stroke-width="14" stroke-linecap="round"/><line x1="60" y1="-70" x2="-60" y2="70" stroke="#d9534f" stroke-width="14" stroke-linecap="round"/></g></g>
  <g id="qCard"><rect x="-210" y="-135" width="420" height="270" rx="22" fill="#fff" stroke="#14273f" stroke-width="4" filter="url(#shadow)"/>
    <text x="0" y="-92" text-anchor="middle" font-size="26" font-weight="900" fill="#14273f">What happened?</text>
    <g id="qc0"><rect x="-180" y="-66" width="360" height="40" rx="12" fill="#eef3fa"/><text x="-162" y="-40" font-size="20" font-weight="700" fill="#14273f">Defective goods</text></g>
    <g id="qc1"><rect x="-180" y="-14" width="360" height="40" rx="12" fill="#eef3fa"/><text x="-162" y="12" font-size="20" font-weight="700" fill="#14273f">Money not returned</text></g>
    <g id="qc2"><rect x="-180" y="38" width="360" height="40" rx="12" fill="#eef3fa"/><text x="-162" y="64" font-size="20" font-weight="700" fill="#14273f">Something else</text></g>
    <rect id="qsel" x="-180" y="-66" width="360" height="40" rx="12" fill="none" stroke="#2f8f6b" stroke-width="5"/>
    <text x="0" y="112" text-anchor="middle" font-size="17" font-weight="800" fill="#5b6b82">plain words, no legal forms</text></g>
  <g id="bookCard"><rect x="-210" y="-135" width="420" height="270" rx="22" fill="#fff" stroke="#14273f" stroke-width="4" filter="url(#shadow)"/>
    <rect x="-70" y="-110" width="140" height="150" rx="10" fill="#14273f"/><rect x="-60" y="-100" width="120" height="130" rx="6" fill="none" stroke="#d4a72c" stroke-width="3"/>
    <g transform="translate(0 -38) scale(0.8)" stroke="#d4a72c" stroke-width="4" fill="none" stroke-linecap="round"><line x1="0" y1="-26" x2="0" y2="22"/><line x1="-26" y1="-16" x2="26" y2="-16"/><path d="M-26 -16 L-34 4 Q-26 12 -18 4 Z"/><path d="M26 -16 L18 4 Q26 12 34 4 Z"/></g>
    <text x="0" y="68" text-anchor="middle" font-size="22" font-weight="900" fill="#14273f">Constitution &amp; Key Statutes</text>
    <text x="0" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#5b6b82">browse before you ever start a case</text></g>
  <g id="logPill"><rect x="-110" y="-26" width="220" height="52" rx="26" fill="#14273f" filter="url(#shadow)"/><text x="0" y="9" text-anchor="middle" font-size="24" font-weight="900" fill="#d4a72c">Log in to begin</text></g>
`);

// ---- S3: businesses ----
addScene('S3', 'url(#gCool)', `
  ${floor()}
  ${desk('dk3', 40, 560)}
  ${person('bz0', { skin: '#d9a47c', hair: '#161616', shirt: '#4b5565', male: true, tie: true })}
  ${person('bz1', { skin: '#e2b28d', hair: '#2a1a12', shirt: '#6b4c9a', longHair: true })}
  <g id="inv0">${paper('iv0', 96, 124, '#fff', 6, '#d9534f')}<text x="0" y="12" text-anchor="middle" font-size="20" font-weight="900" fill="#d9534f" transform="rotate(-12)">UNPAID</text></g>
  <g id="inv1">${paper('iv1', 96, 124, '#fff', 6, '#d9534f')}<text x="0" y="12" text-anchor="middle" font-size="20" font-weight="900" fill="#d9534f" transform="rotate(8)">UNPAID</text></g>
  <g id="inv2">${paper('iv2', 96, 124, '#fff', 6, '#d9534f')}<text x="0" y="12" text-anchor="middle" font-size="20" font-weight="900" fill="#d9534f" transform="rotate(-6)">UNPAID</text></g>
  ${bubble('bDues', 'Chasing dues…', 260, 70, '#fff', '#14273f', 'left', 26, '#14273f')}
  <g id="fl0"><rect x="-150" y="-34" width="300" height="68" rx="16" fill="#3b6ea5" filter="url(#shadow)"/><text x="0" y="9" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">Money Recovery Suit</text></g>
  <g id="fl1"><rect x="-150" y="-34" width="300" height="68" rx="16" fill="#7b4a9e" filter="url(#shadow)"/><text x="0" y="9" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">Commercial Courts Act</text></g>
  <g id="fl2"><rect x="-150" y="-34" width="300" height="68" rx="16" fill="#2f8f6b" filter="url(#shadow)"/><text x="0" y="9" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">DRT application</text></g>
  <g id="fl3"><rect x="-150" y="-34" width="300" height="68" rx="16" fill="#d9534f" filter="url(#shadow)"/><text x="0" y="9" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">NCLT Section 9</text></g>
  ${chip('recov', 'Dues recovered', 250, '#2f8f6b', '#fff', 26)}
  <g id="coins"><circle id="c0" r="22" fill="#d4a72c" stroke="#a67c10" stroke-width="4"/><circle id="c1" r="22" fill="#d4a72c" stroke="#a67c10" stroke-width="4"/><circle id="c2" r="22" fill="#d4a72c" stroke="#a67c10" stroke-width="4"/>
    <text id="ct0" font-size="24" font-weight="900" fill="#14273f" text-anchor="middle">₹</text><text id="ct1" font-size="24" font-weight="900" fill="#14273f" text-anchor="middle">₹</text><text id="ct2" font-size="24" font-weight="900" fill="#14273f" text-anchor="middle">₹</text></g>
`);

// ---- S4: students ----
addScene('S4', 'url(#gWarm)', `
  ${floor('#efe3c4')}
  ${desk('dk4', 60, 520)}
  ${person('stu', { skin: '#d9a47c', hair: '#161616', shirt: '#e08a1e', male: true })}
  <g id="books"><rect x="-70" y="-20" width="140" height="22" rx="4" fill="#3b6ea5"/><rect x="-62" y="-42" width="124" height="22" rx="4" fill="#d9534f"/><rect x="-56" y="-64" width="112" height="22" rx="4" fill="#2f8f6b"/></g>
  <g id="actCard"><rect x="-230" y="-100" width="460" height="200" rx="20" fill="#fff" stroke="#14273f" stroke-width="4" filter="url(#shadow)"/>
    <text x="-200" y="-62" font-size="22" font-weight="900" fill="#14273f">Sourced Act text</text>
    <rect x="-200" y="-40" width="300" height="9" rx="4" fill="#b8c2cf"/><rect x="-200" y="-22" width="380" height="9" rx="4" fill="#b8c2cf"/><rect x="-200" y="-4" width="340" height="9" rx="4" fill="#b8c2cf"/><rect x="-200" y="14" width="390" height="9" rx="4" fill="#b8c2cf"/><rect x="-200" y="32" width="250" height="9" rx="4" fill="#b8c2cf"/>
    <text x="-200" y="76" font-size="17" font-weight="700" fill="#5b6b82">primary text, not summarised</text></g>
  ${bubble('qBub', 'What does this section say?', 400, 74, '#3b6ea5', '#14273f', 'left', 24, '#fff')}
  <g id="aCard"><rect x="-230" y="-70" width="460" height="140" rx="20" fill="#fff" stroke="#14273f" stroke-width="4" filter="url(#shadow)"/>
    <rect x="-200" y="-44" width="360" height="9" rx="4" fill="#b8c2cf"/><rect x="-200" y="-26" width="400" height="9" rx="4" fill="#b8c2cf"/><rect x="-200" y="-8" width="320" height="9" rx="4" fill="#b8c2cf"/>
    <rect x="-200" y="18" width="330" height="36" rx="18" fill="#2f8f6b"/><text x="-35" y="43" text-anchor="middle" font-size="19" font-weight="900" fill="#fff">answers only from the Act's text</text></g>
  ${chip('study', 'for study, not a substitute', 380, '#e08a1e', '#fff', 24)}
`);
CAP('stu');

// ---- S5: close ----
addScene('S5', 'url(#gSun)', `
  <g id="stars"></g>
  <g id="lgo">${logo('lg', 150)}</g>
  <text id="brand" class="serif" x="640" y="330" text-anchor="middle" font-size="84" font-weight="700" fill="#14273f">LawFilings</text>
  <text id="tg1" x="640" y="420" text-anchor="middle" font-size="40" font-weight="900" fill="#a67c10">Built for the one who</text>
  <text id="tg2" x="640" y="472" text-anchor="middle" font-size="40" font-weight="900" fill="#a67c10">actually files court cases</text>
  <g id="urlpill"><rect x="-170" y="-30" width="340" height="60" rx="30" fill="#d4a72c"/><text x="0" y="10" text-anchor="middle" font-size="32" font-weight="900" fill="#14273f">lawfilings.in</text></g>
`);
(() => { let s = ''; for (let i = 0; i < 40; i++) s += `<circle id="st${i}" r="${2 + (i % 3)}" fill="#d4a72c"/>`; $('stars').innerHTML = s; })();

// ---------- helpers & animators ----------
function idle(id, t, m, talk) {
  $(id + '-body').setAttribute('transform', `translate(0 ${Math.sin(t * 2.6) * 1})`);
  mood(id, talk && Math.sin(t * 14) > 0.1 ? 'talk' : m, (t % 3.4) > 3.28);
}
const SCENE_IDS = ['S0', 'S1', 'S2', 'S3', 'S4', 'S5'];

function sceneS0(t) {
  $('eyebrow').style.opacity = fade(t, 0.2, 0.4);
  $('ttl1').style.opacity = fade(t, 0.4, 0.5); $('ttl2').style.opacity = fade(t, 0.9, 0.5);
  const xs = [250, 480, 800, 1030], cols = ['p0', 'p1', 'p2', 'p3'];
  ['a0', 'a1', 'a2', 'a3'].forEach((id, i) => {
    const k = Math.max(0, pop(t, 1.4 + i * 0.75, 0.5));
    tf(id, { x: xs[i], y: 560 + (1 - k) * 40, s: 1.0 * k });
    arm(id, 'L', -66, -40); arm(id, 'R', 66, -40);
    idle(id, t + i, 'happy', false);
    tf(cols[i], { x: xs[i], y: 610 - 6, s: k });
  });
}
function sceneS1(t) {
  tf('dk1', {}); tf('adv', { x: 300, y: 480, s: 1.3 });
  const up = easeOut(seg(t, 9.2, 10.0));
  arm('adv', 'L', -52, -22); arm('adv', 'R', lerp(46, 100, up) + Math.sin(t * 6) * (up < 1 ? 3 : 0), lerp(-22, -150, up));
  idle('adv', t, 'happy', t < 12.8);
  const fp = [[770, 105], [980, 105], [1170, 105], [840, 170], [1090, 170]];
  for (let i = 0; i < 5; i++) tf('fc' + i, { x: fp[i][0], y: fp[i][1], s: pop(t, 0.6 + i * 0.85, 0.4) });
  tf('adoc', { x: 880, y: 420, s: pop(t, 5.6, 0.5), r: -2 });
  $('hl').setAttribute('width', 192 * easeOut(seg(t, 7.0, 7.9)));
  tf('cite', { x: 880, y: 262, s: pop(t, 7.4, 0.45) * 0.9 });
  tf('timeCard', { x: 1130, y: 430, s: pop(t, 9.0, 0.5) * 0.82 });
  const sh = easeIO(seg(t, 10.0, 12.8));
  $('barF').setAttribute('width', lerp(240, 50, sh)); $('barJ').setAttribute('width', lerp(60, 240, sh));
}
function sceneS2(t) {
  tf('dk2', {}); tf('ind', { x: 300, y: 480, s: 1.3 });
  arm('ind', 'L', -52, -22); arm('ind', 'R', 52, -22);
  idle('ind', t, t < 2.4 ? 'sad' : 'happy', t > 2.4 && t < 6.5);
  // legal forms: fly in, X, fly out
  const fin = easeOut(seg(t, 0.2, 0.9)), fout = easeIO(seg(t, 2.3, 3.0));
  for (let i = 0; i < 3; i++) tf('lf' + i, { x: 620 + (i - 1) * 40 + fout * 700, y: 300 + i * 6 - (1 - fin) * 200, s: 1.1 * fin, r: (i - 1) * 9, o: 1 });
  tf('xmark', { x: 0, y: 0, s: pop(t, 1.4, 0.3) });
  $('forms').style.opacity = t < 2.3 ? 1 : 1 - fout;
  // question card
  const qv = pop(t, 3.0, 0.5), qOut = easeOut(seg(t, 6.4, 6.9));
  tf('qCard', { x: 900, y: 300, s: Math.max(0, qv) * (1 - qOut) });
  ['qc0', 'qc1', 'qc2'].forEach((k, i) => { $(k).style.opacity = fade(t, 3.6 + i * 0.4, 0.3); });
  const pick = t < 5.2 ? 0 : 1;
  $('qsel').setAttribute('y', -66 + pick * 52);
  $('qsel').style.opacity = fade(t, 4.4, 0.3);
  // constitution book card
  const bv = pop(t, 7.0, 0.5);
  tf('bookCard', { x: 900, y: 290, s: Math.max(0, bv) });
  tf('logPill', { x: 900, y: 520, s: pop(t, 8.2, 0.45) * 0.9 });
}
function sceneS3(t) {
  tf('dk3', {}); tf('bz0', { x: 200, y: 480, s: 1.25 }); tf('bz1', { x: 400, y: 480, s: 1.25 });
  arm('bz0', 'L', -52, -22); arm('bz0', 'R', 52, -22); arm('bz1', 'L', -52, -22); arm('bz1', 'R', 52, -22);
  idle('bz0', t, t < 4 ? 'sad' : 'happy', false); idle('bz1', t + 1, t < 4 ? 'sad' : 'happy', false);
  for (let i = 0; i < 3; i++) tf('inv' + i, { x: 560 + i * 38, y: 430 - i * 6, s: pop(t, 0.4 + i * 0.35, 0.4) * 0.95, r: (i - 1) * 6 });
  tf('bDues', { x: 500, y: 215, s: pop(t, 1.2, 0.45) * (t < 4.2 ? 1 : 1 - seg(t, 4.2, 4.6)) });
  const times = [4.2, 6.2, 8.4, 10.2];
  for (let i = 0; i < 4; i++) tf('fl' + i, { x: 1030, y: 130 + i * 92, s: pop(t, times[i], 0.4) });
  tf('recov', { x: 640, y: 300, s: pop(t, 11.2, 0.45) });
  for (let i = 0; i < 3; i++) {
    const p = seg(t, 11.0 + i * 0.35, 12.2 + i * 0.35);
    const x = lerp(590 + i * 20, 650 + i * 14, easeOut(p)), y = lerp(420, 330, easeOut(p)) - Math.sin(p * Math.PI) * 50;
    tf('c' + i, { x, y, s: p > 0 && p < 1 ? 1 : 0 });
    tf('ct' + i, { x, y: y + 8, s: p > 0 && p < 1 ? 1 : 0 });
  }
}
function sceneS4(t) {
  tf('dk4', {}); tf('stu', { x: 300, y: 480, s: 1.3 });
  arm('stu', 'L', -52, -22); arm('stu', 'R', 52, -22);
  idle('stu', t, 'happy', t < 12);
  tf('books', { x: 470, y: 480, s: pop(t, 0.2, 0.4) });
  tf('actCard', { x: 900, y: 170, s: pop(t, 0.8, 0.5) * 0.85 });
  tf('qBub', { x: 880, y: 330, s: pop(t, 5.0, 0.45) * 0.8 });
  tf('aCard', { x: 900, y: 440, s: pop(t, 6.6, 0.5) * 0.8 });
  tf('study', { x: 640, y: 560 - 0, s: 0 });
  tf('study', { x: 900, y: 545, s: pop(t, 10.0, 0.5) * 0.9 });
}
function sceneS5(t, L) {
  for (let i = 0; i < 40; i++) { const x = (i * 197 + 60) % 1280, y = (i * 83 + 30) % 700; tf('st' + i, { x, y: y + Math.sin(t * 1.5 + i) * 3, o: 0.18 + 0.3 * Math.abs(Math.sin(t * 2 + i)) }); }
  tf('lg', { x: 640, y: 160 + Math.sin(t * 2) * 4, s: 1.7 * pop(t, 0.0, 0.7) });
  $('brand').style.opacity = fade(t, 0.4, 0.5);
  $('tg1').style.opacity = fade(t, 1.0, 0.5); $('tg2').style.opacity = fade(t, 1.5, 0.5);
  tf('urlpill', { x: 640, y: 570, s: pop(t, 3.0, 0.5) });
}

if (String(window.__LANG).endsWith('hi')) applyDict(window.DICT_HI);

// ---------- main seek ----------
let TL = null;
window.__setTimeline = (tl) => { TL = tl; };
window.__seek = (T) => {
  if (!TL) return;
  let si = TL.scenes.findIndex((s) => T < s.end);
  if (si < 0) si = TL.scenes.length - 1;
  const sc = TL.scenes[si];
  const base = si === 0 ? 0 : sc.start;
  const t = Math.max(0, T - base);
  SCENE_IDS.forEach((id, i) => { $(id).style.display = i === si ? '' : 'none'; });
  [sceneS0, sceneS1, sceneS2, sceneS3, sceneS4, sceneS5][si](t);
  const cur = sc.lines.find((l) => T >= l.start - 0.1 && T < l.end + 0.25);
  const cap = $('caption');
  if (cur) { cap.style.display = ''; if (cap.dataset.t !== cur.text) { cap.textContent = cur.text; cap.dataset.t = cur.text; } cap.style.opacity = Math.min(1, seg(T, cur.start - 0.1, cur.start + 0.15)); }
  else cap.style.display = 'none';
  $('scenes').style.opacity = si === 0 ? 1 : 0.15 + 0.85 * seg(T, sc.start, sc.start + 0.35);
};
</script>
