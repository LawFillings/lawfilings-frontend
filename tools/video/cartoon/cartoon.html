<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>LawFilings cartoon promo</title>
<style>
  html, body { margin: 0; background: #000; }
  #stage { background: #f3ead6; position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }
  svg { position: absolute; inset: 0; }
  #caption { position: absolute; left: 90px; right: 90px; bottom: 26px; text-align: center; color: #fff; font-size: 27px; line-height: 1.3;
    background: rgba(20, 39, 63, 0.82); border-radius: 14px; padding: 12px 22px; font-weight: 600; letter-spacing: .1px; }
  text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f6eedb"/></linearGradient>
    <linearGradient id="gWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#f6eedc"/></linearGradient>
    <linearGradient id="gCool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcf9f2"/><stop offset="1" stop-color="#f4ecdb"/></linearGradient>
    <linearGradient id="gSun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbef"/><stop offset="1" stop-color="#f8eed2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14273f" flood-opacity="0.22"/></filter>
  </defs>
  <g id="scenes"></g>
</svg>
<div id="caption"></div>
</div>

<script>
// ---------- tiny animation helpers ----------
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIO = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const easeBack = (x) => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function tf(id, o = {}) {
  const el = $(id); if (!el) { console.warn('missing', id); return; }
  const { x = 0, y = 0, s = 1, r = 0, o: op = 1, sx, sy } = o;
  el.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${sx ?? s} ${sy ?? s})`);
  el.style.opacity = op;
}
// pop-in: scale from 0 with overshoot starting at time a over d seconds
const pop = (t, a, d = 0.5) => easeBack(seg(t, a, a + d));
const fade = (t, a, d = 0.4) => seg(t, a, a + d);

// ---------- builders (return SVG markup strings) ----------
const MOODS = {
  sad: 'M-15 26 Q0 12 15 26',
  neutral: 'M-12 22 L12 22',
  happy: 'M-17 14 Q0 36 17 14 Z',
  talk: 'M-12 16 Q0 38 12 16 Z',
  angry: 'M-14 26 Q0 14 14 26',
};
function person(id, o) {
  const { skin = '#e9b98f', hair = '#2b1d16', shirt = '#3b6ea5', coat = false, glasses = false, mustache = false, longHair = false, apron = false, bindi = false } = o;
  const torso = coat ? '#1d1f27' : shirt;
  return `<g id="${id}">
    <g id="${id}-body">
      <path d="M-64 0 L-60 -85 Q-56 -114 -22 -118 L22 -118 Q56 -114 60 -85 L64 0 Z" fill="${torso}"/>
      ${coat ? `<path d="M-20 -118 L0 -60 L20 -118 Z" fill="#f4f4f4"/><path d="M-6 -112 L0 -100 L6 -112 Z" fill="#fff"/><rect x="-5" y="-108" width="4" height="14" fill="#fff"/><rect x="1" y="-108" width="4" height="14" fill="#fff"/><path d="M-22 -118 L-8 -50 L-30 -20 L-40 -110 Z" fill="#14151b"/><path d="M22 -118 L8 -50 L30 -20 L40 -110 Z" fill="#14151b"/>` : ''}
      ${apron ? `<path d="M-40 -110 L-40 0 L40 0 L40 -110 Z" fill="#e9e1cf" opacity="0.95"/>` : ''}
      <rect x="-12" y="-130" width="24" height="18" fill="${skin}"/>
    </g>
    <line id="${id}-aL" x1="-56" y1="-96" x2="-70" y2="-30" stroke="${torso}" stroke-width="26" stroke-linecap="round"/>
    <line id="${id}-aR" x1="56" y1="-96" x2="70" y2="-30" stroke="${torso}" stroke-width="26" stroke-linecap="round"/>
    <circle id="${id}-hL" cx="-70" cy="-30" r="13" fill="${skin}"/>
    <circle id="${id}-hR" cx="70" cy="-30" r="13" fill="${skin}"/>
    <g id="${id}-head" transform="translate(0 -168)">
      ${longHair ? `<path d="M-52 -4 Q-58 -64 0 -66 Q58 -64 52 -4 L56 50 L-56 50 Z" fill="${hair}"/>` : ''}
      <circle r="47" fill="${skin}"/>
      ${longHair
        ? `<path d="M-48 -10 Q-40 -58 0 -58 Q40 -58 48 -10 Q20 -34 -4 -30 Q-30 -26 -48 -10 Z" fill="${hair}"/>`
        : `<path d="M-47 -8 Q-50 -56 0 -56 Q50 -56 47 -8 Q38 -36 0 -36 Q-38 -36 -47 -8 Z" fill="${hair}"/>`}
      ${bindi ? '<circle cx="0" cy="-20" r="3.5" fill="#d33"/>' : ''}
      <circle id="${id}-eL" cx="-17" cy="-6" r="6.5" fill="#1a1a1a"/><circle id="${id}-eR" cx="17" cy="-6" r="6.5" fill="#1a1a1a"/>
      <circle cx="-15" cy="-8" r="2" fill="#fff"/><circle cx="19" cy="-8" r="2" fill="#fff"/>
      <line id="${id}-bL" x1="-27" y1="-20" x2="-9" y2="-20" stroke="${hair}" stroke-width="4.5" stroke-linecap="round"/>
      <line id="${id}-bR" x1="9" y1="-20" x2="27" y2="-20" stroke="${hair}" stroke-width="4.5" stroke-linecap="round"/>
      ${glasses ? '<circle cx="-17" cy="-6" r="13" fill="none" stroke="#222" stroke-width="3"/><circle cx="17" cy="-6" r="13" fill="none" stroke="#222" stroke-width="3"/><line x1="-4" y1="-6" x2="4" y2="-6" stroke="#222" stroke-width="3"/>' : ''}
      ${mustache ? '<path d="M-20 14 Q-10 6 0 12 Q10 6 20 14 Q10 20 0 15 Q-10 20 -20 14 Z" fill="#2b1d16"/>' : ''}
      <path id="${id}-mouth" d="${MOODS.neutral}" transform="translate(0 ${mustache ? 14 : 8})" fill="#a33" stroke="#7b2020" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="-30" cy="12" rx="8" ry="5" fill="#e07a7a" opacity=".35"/><ellipse cx="30" cy="12" rx="8" ry="5" fill="#e07a7a" opacity=".35"/>
    </g>
  </g>`;
}
function mood(id, m, blink = false) {
  const p = $(id + '-mouth'); p.setAttribute('d', MOODS[m] || MOODS.neutral);
  p.setAttribute('fill', m === 'happy' || m === 'talk' ? '#a33' : 'none');
  const ang = { sad: [-14, 14], angry: [16, -16], happy: [-6, 6], neutral: [0, 0], talk: [-4, 4] }[m] || [0, 0];
  $(id + '-bL').setAttribute('transform', `rotate(${ang[0]} -18 -20)`);
  $(id + '-bR').setAttribute('transform', `rotate(${ang[1]} 18 -20)`);
  const ry = blink ? 0.15 : 1;
  for (const e of ['eL', 'eR']) $(id + '-' + e).setAttribute('transform', `translate(0 ${blink ? -6 : 0}) scale(1 ${ry})`);
}
// place an arm: shoulder is fixed, hand moves
function arm(id, side, hx, hy) {
  const sx = side === 'L' ? -56 : 56;
  const a = $(`${id}-a${side}`); a.setAttribute('x2', hx); a.setAttribute('y2', hy);
  const h = $(`${id}-h${side}`); h.setAttribute('cx', hx); h.setAttribute('cy', hy);
}
function headTilt(id, dx, dy, r) { $(id + '-head').setAttribute('transform', `translate(${dx} ${-168 + dy}) rotate(${r})`); }

function paper(id, w = 70, h = 90, color = '#fff', lines = 5, accent = '#3b6ea5') {
  let ls = '';
  for (let i = 0; i < lines; i++) ls += `<rect x="${-w / 2 + 8}" y="${-h / 2 + 14 + i * ((h - 26) / lines)}" width="${(i === 0 ? 0.5 : 0.78 + (i % 2) * 0.1) * (w - 16)}" height="4" rx="2" fill="${i === 0 ? accent : '#b8c2cf'}"/>`;
  return `<g id="${id}"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="5" fill="${color}" stroke="#c7cfdb" stroke-width="2" filter="url(#shadow)"/>${ls}</g>`;
}
function bubble(id, text, w, h, fill = '#fff', stroke = '#14273f', tail = 'left', size = 24, color = '#14273f') {
  const tailPath = tail === 'left' ? `M${-w / 2 + 28} ${h / 2 - 2} L${-w / 2 - 6} ${h / 2 + 30} L${-w / 2 + 62} ${h / 2 - 2} Z` : tail === 'right' ? `M${w / 2 - 28} ${h / 2 - 2} L${w / 2 + 6} ${h / 2 + 30} L${w / 2 - 62} ${h / 2 - 2} Z` : '';
  return `<g id="${id}"><path d="${tailPath}" fill="${fill}" stroke="${stroke}" stroke-width="3"/><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="22" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
  <path d="${tailPath}" fill="${fill}" stroke="none" transform="translate(0 -1)"/>
  <text x="0" y="${size * 0.35}" text-anchor="middle" font-size="${size}" font-weight="800" fill="${color}">${text}</text></g>`;
}
function chip(id, text, w, fill, color = '#fff', size = 22) {
  return `<g id="${id}"><rect x="${-w / 2}" y="-24" width="${w}" height="48" rx="24" fill="${fill}" filter="url(#shadow)"/><text x="0" y="${size * 0.36}" text-anchor="middle" font-size="${size}" font-weight="800" fill="${color}">${text}</text></g>`;
}
function logo(id, size = 1) {
  return `<g id="${id}"><circle r="44" fill="#14273f"/><circle r="44" fill="none" stroke="#d4a72c" stroke-width="4"/>
   <g stroke="#d4a72c" stroke-width="4" fill="none" stroke-linecap="round"><line x1="0" y1="-26" x2="0" y2="22"/><line x1="-26" y1="-16" x2="26" y2="-16"/><path d="M-26 -16 L-34 4 Q-26 12 -18 4 Z"/><path d="M26 -16 L18 4 Q26 12 34 4 Z"/><line x1="-14" y1="24" x2="14" y2="24"/></g></g>`;
}
function washer(id) {
  return `<g id="${id}">
    <rect x="-90" y="-190" width="180" height="200" rx="14" fill="#f4f6f9" stroke="#b9c3d1" stroke-width="4" filter="url(#shadow)"/>
    <rect x="-90" y="-190" width="180" height="42" rx="14" fill="#dfe6ee"/>
    <circle cx="-56" cy="-169" r="9" fill="#9aa6b6"/><circle id="${id}-led" cx="62" cy="-169" r="9" fill="#e23b3b"/>
    <rect x="-34" y="-176" width="64" height="14" rx="4" fill="#1f2a3a"/><text x="-2" y="-165" text-anchor="middle" font-size="12" font-weight="800" fill="#ff5555">ERR</text>
    <circle cx="0" cy="-60" r="62" fill="#c8d3e0" stroke="#8d9bb0" stroke-width="6"/>
    <circle cx="0" cy="-60" r="46" fill="#5a6b83"/><circle cx="0" cy="-60" r="46" fill="#7e90a8" opacity=".5"/>
    <path d="M-30 -80 Q-10 -96 14 -86" stroke="#fff" stroke-width="6" fill="none" opacity=".5" stroke-linecap="round"/>
    <g id="${id}-crack"><path d="M10 -100 L0 -76 L14 -66 L-4 -40" stroke="#222" stroke-width="3" fill="none"/></g>
  </g>`;
}

// ---------- scene construction ----------
const scenes = $('scenes');
function addScene(id, bg, content) { scenes.insertAdjacentHTML('beforeend', `<g id="${id}"><rect width="1280" height="720" fill="${bg}"/>${content}</g>`); }

// S0: the hook ---------------------------------------------------------------------------------
addScene('S0', 'url(#gCool)', `
  <rect y="540" width="1280" height="180" fill="#eee3c9"/><rect y="536" width="1280" height="8" fill="#e0d2ae"/>
  <g id="s0-win"><rect x="70" y="70" width="230" height="230" rx="12" fill="#cfe6fb" stroke="#fff" stroke-width="10"/><line x1="185" y1="70" x2="185" y2="300" stroke="#fff" stroke-width="8"/><line x1="70" y1="185" x2="300" y2="185" stroke="#fff" stroke-width="8"/></g>
  <g id="s0-shop"><rect x="820" y="420" width="330" height="120" rx="10" fill="#8a5a3c"/><rect x="820" y="410" width="330" height="22" rx="8" fill="#a8744f"/><rect x="870" y="64" width="240" height="70" rx="12" fill="#d9534f"/><text x="990" y="110" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">SHOP</text></g>
  ${person('seller', { skin: '#d9a47c', hair: '#201510', shirt: '#2f8f6b', apron: true, mustache: true })}
  ${washer('wm')}
  ${person('asha', { skin: '#e9b98f', hair: '#201510', shirt: '#7b4a9e', longHair: true, bindi: true })}
  ${paper('receipt', 62, 80, '#fffdf2', 5, '#d9534f')}
  <g id="s0-smoke"><circle id="sm0" r="22" fill="#9aa3ad"/><circle id="sm1" r="26" fill="#aab2bb"/><circle id="sm2" r="20" fill="#9aa3ad"/><circle id="sm3" r="24" fill="#b6bdc5"/></g>
  ${bubble('bNo', 'No refund!', 250, 76, '#fff', '#14273f', 'right', 30, '#c0392b')}
  <g id="s0-forms"></g>
  <g id="cloudLogo">
    <g stroke="#14273f" stroke-width="7" fill="#14273f"><circle cx="-150" cy="10" r="60"/><circle cx="-90" cy="-30" r="70"/><circle cx="0" cy="-45" r="75"/><circle cx="90" cy="-30" r="70"/><circle cx="150" cy="10" r="60"/><circle cx="100" cy="45" r="55"/><circle cx="0" cy="55" r="60"/><circle cx="-100" cy="45" r="55"/><circle cx="-180" cy="82" r="16"/><circle cx="-196" cy="118" r="11"/></g>
    <g fill="#fff"><circle cx="-150" cy="10" r="60"/><circle cx="-90" cy="-30" r="70"/><circle cx="0" cy="-45" r="75"/><circle cx="90" cy="-30" r="70"/><circle cx="150" cy="10" r="60"/><circle cx="100" cy="45" r="55"/><circle cx="0" cy="55" r="60"/><circle cx="-100" cy="45" r="55"/><circle cx="-180" cy="82" r="16"/><circle cx="-196" cy="118" r="11"/></g>
    <g transform="translate(-112 5) scale(0.9)">${logo('cl-logo')}</g>
    <text class="serif" x="-62" y="22" font-size="46" font-weight="700" fill="#14273f">LawFilings</text>
  </g>
  ${chip('cForms', 'Forms', 150, '#d9534f')}${chip('cFormat', 'Format', 150, '#e08a1e')}${chip('cLegal', 'Legal language', 250, '#7b4a9e')}${chip('cRun', 'Running around', 250, '#2f8f6b')}
  <g id="s0-qs"><text id="q0" font-size="70" font-weight="900" fill="#d9534f">?</text><text id="q1" font-size="54" font-weight="900" fill="#e08a1e">?</text><text id="q2" font-size="62" font-weight="900" fill="#7b4a9e">?</text></g>
`);
// forms swirl sprites
(() => { let h = ''; for (let i = 0; i < 9; i++) h += paper('f' + i, 60, 78, '#fff', 4, ['#d9534f', '#e08a1e', '#7b4a9e'][i % 3]); $('s0-forms').innerHTML = h; })();

// S1: the litigant solution ---------------------------------------------------------------------
addScene('S1', 'url(#gSun)', `
  <rect y="560" width="1280" height="160" fill="#efe3c4"/>
  <g id="desk1"><rect x="150" y="470" width="520" height="30" rx="8" fill="#9b6a43"/><rect x="190" y="500" width="22" height="130" fill="#8a5a3a"/><rect x="610" y="500" width="22" height="130" fill="#8a5a3a"/></g>
  ${person('asha2', { skin: '#e9b98f', hair: '#201510', shirt: '#7b4a9e', longHair: true, bindi: true })}
  <g id="laptop" transform="translate(95 0)">
    <path d="M250 470 L560 470 L590 440 L280 440 Z" fill="#c6ced9" stroke="#9aa6b6" stroke-width="3"/>
    <g id="screen"><rect x="270" y="270" width="290" height="176" rx="10" fill="#1f2a3a"/><rect x="278" y="278" width="274" height="160" rx="6" fill="#f7fafc"/>
      <rect x="278" y="278" width="274" height="26" rx="6" fill="#14273f"/><text x="290" y="297" font-size="14" font-weight="800" fill="#d4a72c">LawFilings</text>
      <g id="scr-a"><rect x="292" y="318" width="120" height="28" rx="8" fill="#dfe9f6"/><text x="352" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#14273f">Choose court</text></g>
      <g id="scr-b"><rect x="292" y="354" width="120" height="28" rx="8" fill="#e9f5ec"/><text x="352" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#14273f">Answer questions</text></g>
      <g id="scr-c"><rect x="292" y="390" width="120" height="28" rx="8" fill="#f6ecf9"/><text x="352" y="409" text-anchor="middle" font-size="13" font-weight="700" fill="#14273f">Review draft</text></g>
      <g id="ck-a"><circle cx="432" cy="332" r="11" fill="#2f8f6b"/><path d="M426 332 L431 337 L439 327" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>
      <g id="ck-b"><circle cx="432" cy="368" r="11" fill="#2f8f6b"/><path d="M426 368 L431 373 L439 363" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>
      <g id="ck-c"><circle cx="432" cy="404" r="11" fill="#2f8f6b"/><path d="M426 404 L431 409 L439 399" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>
      <rect x="456" y="318" width="84" height="100" rx="6" fill="#fff" stroke="#c7cfdb" stroke-width="2"/><rect x="464" y="330" width="52" height="5" rx="2" fill="#3b6ea5"/><rect x="464" y="344" width="68" height="4" rx="2" fill="#b8c2cf"/><rect x="464" y="354" width="62" height="4" rx="2" fill="#b8c2cf"/><rect x="464" y="364" width="68" height="4" rx="2" fill="#b8c2cf"/><rect x="464" y="374" width="50" height="4" rx="2" fill="#b8c2cf"/>
    </g>
  </g>
  <g id="draftDoc">${paper('dd', 150, 190, '#fff', 8, '#3b6ea5')}<text x="0" y="-62" text-anchor="middle" font-size="13" font-weight="900" fill="#14273f">CONSUMER</text><text x="0" y="-46" text-anchor="middle" font-size="13" font-weight="900" fill="#14273f">COMPLAINT</text>
    <g id="stamp"><circle cx="38" cy="62" r="28" fill="none" stroke="#2f8f6b" stroke-width="5"/><path d="M26 62 L36 72 L52 52" stroke="#2f8f6b" stroke-width="6" fill="none" stroke-linecap="round"/></g></g>
  <g id="portal"><rect x="-150" y="-110" width="300" height="220" rx="14" fill="#fff" stroke="#14273f" stroke-width="4" filter="url(#shadow)"/><rect x="-150" y="-110" width="300" height="38" rx="14" fill="#14273f"/><rect x="-150" y="-86" width="300" height="14" fill="#14273f"/>
    <text x="0" y="-84" text-anchor="middle" font-size="19" font-weight="900" fill="#d4a72c">e-Jagriti portal</text>
    <g id="pl0"><circle cx="-112" cy="-40" r="14" fill="#2f8f6b"/><path d="M-119 -40 L-113 -34 L-104 -46" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/><text x="-88" y="-34" font-size="19" font-weight="800" fill="#14273f">Register</text></g>
    <g id="pl1"><circle cx="-112" cy="6" r="14" fill="#2f8f6b"/><path d="M-119 6 L-113 12 L-104 0" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/><text x="-88" y="12" font-size="19" font-weight="800" fill="#14273f">Upload documents</text></g>
    <g id="pl2"><circle cx="-112" cy="52" r="14" fill="#2f8f6b"/><path d="M-119 52 L-113 58 L-104 46" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/><text x="-88" y="58" font-size="19" font-weight="800" fill="#14273f">Pay fee &amp; submit</text></g>
  </g>
  <g id="dirCard"><rect x="-170" y="-120" width="340" height="240" rx="18" fill="#fff" stroke="#14273f" stroke-width="4" filter="url(#shadow)"/>
    <text x="0" y="-84" text-anchor="middle" font-size="22" font-weight="900" fill="#14273f">Find an Advocate</text>
    <circle cx="-86" cy="-6" r="34" fill="#e9b98f"/><path d="M-120 -8 Q-110 -44 -86 -42 Q-60 -44 -52 -8 Q-70 -26 -86 -22 Q-104 -24 -120 -8Z" fill="#201510"/><circle cx="-98" cy="-4" r="4" fill="#1a1a1a"/><circle cx="-74" cy="-4" r="4" fill="#1a1a1a"/><path d="M-98 12 Q-86 24 -74 12" stroke="#a33" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-132 40 Q-132 18 -86 20 Q-40 18 -40 40 L-40 62 L-132 62 Z" fill="#1d1f27"/><rect x="-92" y="22" width="12" height="16" fill="#fff"/>
    <text x="30" y="-18" font-size="20" font-weight="900" fill="#14273f">Adv. verified</text>
    <g id="badge"><circle cx="48" cy="22" r="22" fill="#2f8f6b"/><path d="M37 22 L45 30 L60 12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <text x="0" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#5b6b82">Bar Council enrolment verified</text>
  </g>
  <g id="envelope"><rect x="-44" y="-30" width="88" height="60" rx="8" fill="#fff" stroke="#14273f" stroke-width="4"/><path d="M-44 -26 L0 8 L44 -26" fill="none" stroke="#14273f" stroke-width="4"/><circle cx="30" cy="-30" r="12" fill="#d9534f"/><text x="30" y="-25" text-anchor="middle" font-size="15" font-weight="900" fill="#fff">1</text></g>
  <g id="langs"><g id="lg1"><rect x="-110" y="-24" width="220" height="48" rx="24" fill="#3b6ea5" filter="url(#shadow)"/><text x="0" y="8" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">in your language</text></g></g>
`);

// S2: pivot - advocate drowning in paperwork ------------------------------------------------------

// ---------- timeline ----------
let TL = null;
const SCENE_IDS = ['S0', 'S1', 'S2', 'S3', 'S4'];
function lineOf(scene, k) { return scene.lines[k]; }
function setScene(n) { SCENE_IDS.forEach((id, i) => { $(id).style.display = i === n ? '' : 'none'; }); }
function person_idle(id, t, mood_, mouthTalk) {
  const bob = Math.sin(t * 2.6) * 2.5;
  $(id + '-body').setAttribute('transform', `translate(0 ${bob * 0.4})`);
  const blink = (t % 3.4) > 3.28;
  mood(id, mouthTalk && Math.sin(t * 14) > 0.1 ? 'talk' : mood_, blink);
}

// ----- per-scene animators; `t` = seconds since scene start; L(k) = [start,end] of narration line k (relative) -----
function sceneS0(t, L) {
  // positions
  tf('seller', { x: 1000, y: 410, s: 1.0 });
  tf('asha', { x: 430, y: 560, s: 1.35 });
  tf('wm', { x: 760, y: 560, s: 1.25 });
  const shock = seg(t, 0.2, 1.0);
  headTilt('asha', 0, 0, Math.sin(t * 5) * 2 * (t > 6 ? 1 : 0));
  arm('asha', 'L', -40, -20);
  // receipt in right hand, raised
  const raise = easeOut(seg(t, 0.4, 1.4));
  arm('asha', 'R', lerp(60, 78, raise), lerp(-30, -110, raise));
  tf('receipt', { x: 430 + (78) * 1.35 + 6, y: 560 + (-150) * 1.35 + 2, s: 1.35 * 0.9, r: 8 + Math.sin(t * 4) * 3, o: raise });
  const sad = t < L[2][0];
  person_idle('asha', t, sad ? (t > L[0][0] + 5 ? 'angry' : 'sad') : 'happy', false);
  // seller shrugs
  const shrug = seg(t, L[0][0] + 2.5, L[0][0] + 3.4);
  arm('seller', 'L', -90, lerp(-30, -105, shrug) + Math.sin(t * 3) * 2);
  arm('seller', 'R', 90, lerp(-30, -105, shrug) + Math.sin(t * 3 + 1) * 2);
  person_idle('seller', t, 'neutral', false);
  // bubble
  tf('bNo', { x: 930, y: 250, s: pop(t, L[0][0] + 3.0, 0.45) * (t < L[1][0] + 0.5 ? 1 : 1 - seg(t, L[1][0] + 0.5, L[1][0] + 1.0)) });
  // smoke
  for (let k = 0; k < 4; k++) {
    const ph = ((t * 0.45 + k / 4) % 1);
    tf('sm' + k, { x: 760 + Math.sin(ph * 6 + k) * 22, y: 360 - ph * 150, s: 0.5 + ph * 1.2, o: (1 - ph) * 0.8 });
  }
  $('wm-led').setAttribute('opacity', Math.sin(t * 7) > 0 ? 1 : 0.25);
  // forms swirl during line 1
  const fa = L[1][0], fb = L[1][1];
  for (let i = 0; i < 9; i++) {
    const p = seg(t, fa + i * 0.18, fa + i * 0.18 + 1.2);
    const swirl = t - fa;
    const ang = swirl * 1.8 + i * 0.7;
    const rad = lerp(520, 150 + (i % 3) * 30, easeOut(p));
    const alive = t > fa && t < L[2][0] - 0.2;
    tf('f' + i, { x: 430 + Math.cos(ang) * rad * 0.9, y: 360 + Math.sin(ang) * rad * 0.45 - 20, s: 1.1 + (i % 3) * 0.15, r: ang * 40, o: alive ? easeOut(p) : 0 });
  }
  const chips = ['cForms', 'cFormat', 'cLegal', 'cRun'];
  const cpos = [[250, 190], [650, 160], [210, 330], [680, 300]];
  chips.forEach((c, i) => tf(c, { x: cpos[i][0], y: cpos[i][1], s: pop(t, fa + 1.6 + i * 1.5, 0.4) * (t < L[2][0] - 0.2 ? 1 : 0) }));
  ['q0', 'q1', 'q2'].forEach((q, i) => {
    const on = t > fb - 3 && t < L[2][0] - 0.2;
    tf(q, { x: [330, 560, 470][i], y: [280, 260, 190][i] + Math.sin(t * 4 + i) * 6, s: on ? 1 : 0, r: [-12, 10, -4][i] });
  });
  tf('cloudLogo', { x: 650, y: 185 + Math.sin(t * 2) * 5, s: pop(t, L[2][0] + 0.2, 0.6) });
  // end wipe
  const wipe = seg(t, L[2][0] - 0.3, L[2][0] + 1.0);
  $('S0').style.opacity = 1 - 0 * wipe;
}

function sceneS1(t, L) {
  tf('asha2', { x: 235, y: 470, s: 1.3 });
  arm('asha2', 'L', -60, -20); arm('asha2', 'R', 95 + Math.sin(t * 6) * 4, -35 + Math.sin(t * 6 + 1) * 4);

  tf('desk1', {});
  // laptop screen UI
  const a0 = L[0][0] + 0.5;
  ['a', 'b', 'c'].forEach((k, i) => { $('scr-' + k).style.opacity = fade(t, a0 + i * 2.2, 0.4); $('ck-' + k).style.opacity = pop(t, a0 + 1.4 + i * 2.2, 0.35) > 0.2 ? Math.min(1, pop(t, a0 + 1.4 + i * 2.2, 0.35)) : 0; });

  tf('stamp', { x: 0, y: 0, s: pop(t, L[0][0] + 9.8, 0.4) });
  // portal
  const pv = seg(t, L[1][0] + 0.2, L[1][0] + 1.0);
  const pOut = 1 - seg(t, L[2][0] - 0.2, L[2][0] + 0.5);

  const ev = seg(t, L[2][0] + 3.6, L[2][0] + 5.4);
  tf('envelope', { x: lerp(460, 800, easeIO(ev)), y: lerp(330, 260, easeIO(ev)) - Math.sin(ev * Math.PI) * 90, s: ev > 0 ? 0.9 : 0, r: lerp(-20, 12, ev), o: ev > 0 && ev < 1 ? 1 : (ev >= 1 ? Math.max(0, 1 - seg(t, L[2][0] + 5.4, L[2][0] + 5.8)) : 0) });
  // "in your own language" chip
  const lv = pop(t, L[0][0] + 5.2, 0.4) * (t < L[0][0] + 9.5 ? 1 : 0);
  tf('lg1', { x: 600, y: 215 + Math.sin(t * 3) * 4, s: lv });
  // hide laptop-driven things order
}

function sceneS3(t, L) {
  tf('rohit2', { x: 330, y: 480, s: 1.3 });

  const upOut = seg(t, l1[0] + 6.8, l1[0] + 7.4);
  tf('upPanel', { x: 780, y: 290, s: 0.86 * easeBack(upIn) * (1 - easeOut(upOut)) });
  tf('upDoc', { x: -190 + 0, y: -20 + Math.sin(t * 3) * 3, s: 1 });
  for (let i = 0; i < 4; i++) $('uf' + i).setAttribute('width', 226 * easeOut(seg(t, l1[0] + 2.0 + i * 0.7, l1[0] + 2.7 + i * 0.7)) * (0.55 + (i % 3) * 0.2));
  const rmIn = seg(t, l1[0] + 7.4, l1[0] + 8.1);
  const rmOut = seg(t, l2[0] - 0.3, l2[0] + 0.3);
  tf('remember', { x: 780, y: 290, s: 0.95 * easeBack(rmIn) * (1 - easeOut(rmOut)) });
  ['rm0', 'rm1', 'rm2'].forEach((k, i) => { $(k).style.opacity = fade(t, l1[0] + 8.3 + i * 0.7, 0.3); });
  // tools (line 2)
  const tp = [[700, 260], [930, 260], [1160, 260]];
  const toolsOut = seg(t, l3[0] - 0.1, l3[0] + 0.5);
  for (let i = 0; i < 3; i++) tf('tl' + i, { x: tp[i][0], y: tp[i][1], s: 0.92 * pop(t, l2[0] + 0.5 + i * 0.9, 0.45) * (1 - easeOut(toolsOut)) });
  // tower: shrinks during line 3
  for (let i = 0; i < 14; i++) {
    const alive = t < l3[0] ? 1 : 1 - easeOut(seg(t, l3[0] + 0.3 + (13 - i) * 0.05, l3[0] + 0.9 + (13 - i) * 0.05));
    const appear = t > l0[0] - 2 ? 1 : 0;
    tf('t3p' + i, { x: 1140, y: 574 - 8 - i * 15, s: Math.max(0.001, alive * appear * (t < l0[0] + 0.5 ? easeBack(seg(t, 0, 0.5)) : 1)), r: (i % 3 - 1) * 2 });
  }
  tf('bMore', { x: 900, y: 300, s: pop(t, l3[0] + 1.3, 0.5) });
  tf('gavel', { x: 0, y: 0, s: 0, o: 0 });
}

function sceneS4(t, L) {
  for (let i = 0; i < 40; i++) { const x = (i * 197 + 60) % 1280, y = (i * 83 + 30) % 700; tf('st' + i, { x, y: y + Math.sin(t * 1.5 + i) * 3, o: 0.18 + 0.3 * Math.abs(Math.sin(t * 2 + i)) }); }
  const p0 = pop(t, 0.0, 0.7);
  tf('lg', { x: 640, y: 160 + Math.sin(t * 2) * 4, s: 1.7 * p0, o: 1 });
  $('brand').style.opacity = fade(t, 0.4, 0.5);
  // language chips float around brand
  LANGS.forEach((l, i) => {
    const a = (i / LANGS.length) * Math.PI * 2 - Math.PI / 2;
    const k = pop(t, L[0][0] + 0.4 + i * 0.12, 0.4);
    const rx = 520, ry = 250;
    tf('lc' + i, { x: 640 + Math.cos(a + t * 0.15) * rx, y: 345 + Math.sin(a + t * 0.15) * ry * 0.85 + 20, s: Math.max(0, k) * 0.8, o: 1 });
  });
  $('n13').style.opacity = fade(t, L[0][0] + 0.2, 0.4) * (t < L[1][0] - 0.2 ? 1 : 1 - seg(t, L[1][0] - 0.2, L[1][0] + 0.4));
  // second line: clear language chips, show tagline + url
  const clr = 1 - seg(t, L[1][0] - 0.3, L[1][0] + 0.5);
  LANGS.forEach((l, i) => { $('lc' + i).style.opacity = clr; });
  $('tag').style.opacity = fade(t, L[1][0] + 0.4, 0.5);
  tf('urlpill', { x: 640, y: 585, s: pop(t, L[1][0] + 2.6, 0.5) });
}

// ---------- main seek ----------
window.__setTimeline = (tl) => { TL = tl; };
window.__seek = (T) => {
  if (!TL) return;
  let si = TL.scenes.findIndex((s) => T < s.end);
  if (si < 0) si = TL.scenes.length - 1;
  const sc = TL.scenes[si];
  const t = Math.max(0, T - (si === 0 ? 0 : sc.start));
  // for scene 0 the lead-in is part of the scene, so shift line starts accordingly (relative to T=0)
  const base = si === 0 ? 0 : sc.start;
  const L = sc.lines.map((l) => [l.start - base, l.end - base]);
  setScene(si);
  [sceneS0, sceneS1, sceneS2, sceneS3, sceneS4][si](t, L);
  // caption
  const cur = sc.lines.find((l) => T >= l.start - 0.1 && T < l.end + 0.25);
  const cap = $('caption');
  if (cur) { cap.style.display = ''; if (cap.dataset.t !== cur.text) { cap.textContent = cur.text; cap.dataset.t = cur.text; } cap.style.opacity = Math.min(1, seg(T, cur.start - 0.1, cur.start + 0.15)); }
  else cap.style.display = 'none';
  // soft cross-fade between scenes
  const fadeIn = seg(T, sc.start - 0.0, sc.start + 0.35);
  $('scenes').style.opacity = si === 0 ? 1 : 0.15 + 0.85 * fadeIn;
};
</script>
